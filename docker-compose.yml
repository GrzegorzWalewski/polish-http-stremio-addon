services:
  addon:
    build:
      # parent dir so the movies-series-fetcher sibling is inside the context
      context: ..
      dockerfile: polish-http-stremio-addon/Dockerfile
    ports:
      - "7777:7777"
    environment:
      PORT: 7777
      # compose network address — overrides the localhost value in .env
      FLARESOLVERR_URL: http://flaresolverr:8191
      # filman auto-session cache lives on a persistent volume (the session
      # file is normally written next to .env — cwd differs in the container).
      # The cached session is portable between the fetcher CLI and the addon:
      # both FlareSolverr containers share the same image (→ same solver UA)
      # and egress via the same public IP, so cf_clearance stays valid.
      FILMAN_SESSION_FILE: /data/filman-session.json
    # TMDB token, filman login/password + 2captcha key, filman cookies/UA etc.
    # come from the fetcher's .env; environment entries above win over this file
    env_file:
      - ../movies-series-fetcher/.env
    volumes:
      - filman-session:/data
    depends_on:
      - flaresolverr
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7777/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    environment:
      LOG_LEVEL: info
    restart: unless-stopped
    # uncomment to reach FlareSolverr from the host (e.g. for msf CLI runs)
    # ports:
    #   - "8191:8191"

volumes:
  filman-session:
